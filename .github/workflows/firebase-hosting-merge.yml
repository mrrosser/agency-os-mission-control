          LIVE_CHANNEL_BEFORE="$(get_hosting_channel live)"
          PREVIEW_CHANNEL_BEFORE="$(get_hosting_channel "$FIREBASE_DEPLOY_CHANNEL")"
          EXPECTED_LIVE_CHANNEL="sites/${FIREBASE_HOSTING_SITE}/channels/live"
          EXPECTED_PREVIEW_CHANNEL="sites/${FIREBASE_HOSTING_SITE}/channels/${FIREBASE_DEPLOY_CHANNEL}"
          EXPECTED_LIVE_URL="https://${FIREBASE_HOSTING_SITE}.web.app"
          PREVIOUS_LIVE_CHANNEL_NAME="$(jq -r '.name // empty' <<< "$LIVE_CHANNEL_BEFORE")"
          PREVIOUS_LIVE_CHANNEL_URL="$(jq -r '.url // empty' <<< "$LIVE_CHANNEL_BEFORE")"
          PREVIOUS_LIVE_HOSTING_RELEASE="$(jq -r '.release.name // empty' <<< "$LIVE_CHANNEL_BEFORE")"
          PREVIOUS_LIVE_HOSTING_VERSION="$(jq -r '.release.version.name // empty' <<< "$LIVE_CHANNEL_BEFORE")"
          PREVIOUS_LIVE_HOSTING_STATUS="$(jq -r '.release.version.status // empty' <<< "$LIVE_CHANNEL_BEFORE")"
