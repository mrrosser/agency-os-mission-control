                  --request POST \
                  --header "Authorization: Bearer $ACCESS_TOKEN" \
                  --header "x-goog-user-project: $FIREBASE_PROJECT_ID" \
                  --header "Content-Type: application/json" \
                  --data "$ROLLBACK_MESSAGE" \
                  --output /dev/null \
                  "https://firebasehosting.googleapis.com/v1beta1/sites/${FIREBASE_HOSTING_SITE}/releases?versionName=${ENCODED_ROLLBACK_VERSION}" || true
              elif [ "$ROLLBACK_LIVE_HOSTING_VERSION" != "$PREVIOUS_LIVE_HOSTING_VERSION" ]; then
                echo "Live Hosting changed to an unrelated version; refusing to overwrite the newer Hosting state."
              fi
            fi
            if [ "$TRAFFIC_SWITCHED" != "1" ] || [ -z "$PREVIOUS_LIVE_REVISION" ]; then
              return
            fi
            ROLLBACK_STATE="$(gcloud run services describe "$FIREBASE_SSR_SERVICE" \
              --project "$FIREBASE_PROJECT_ID" \
              --region "$FIREBASE_REGION" \
              --format=json 2>/dev/null || true)"
            ROLLBACK_LIVE_REVISION="$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100) | .revisionName][0] // empty' \
              <<< "$ROLLBACK_STATE" 2>/dev/null || true)"
