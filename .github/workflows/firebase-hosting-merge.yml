            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --format=json)"
          TAGGED_CANDIDATE_REVISION="$(jq -r --arg tag "$FIREBASE_RELEASE_TAG" '[.status.traffic[]? | select(.tag == $tag) | .revisionName][0] // empty' \
            <<< "$PRE_SWITCH_STATE")"
          CANDIDATE_TRAFFIC="$(jq -r --arg revision "$FIREBASE_RUNTIME_REVISION" '[.status.traffic[]? | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
