            echo "Unable to resolve Cloud Run service URL for $FIREBASE_SSR_SERVICE."
            exit 1
          fi
          SERVICE_STATE="$(gcloud run services describe "$FIREBASE_SSR_SERVICE" \
            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --format=json)"
          DEPLOY_REVISION="$(jq -r '.status.latestCreatedRevisionName // empty' <<< "$SERVICE_STATE")"
          PREVIOUS_LIVE_REVISION="$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100) | .revisionName][0] // empty' <<< "$SERVICE_STATE")"
          if [ -z "$DEPLOY_REVISION" ] || [ -z "$PREVIOUS_LIVE_REVISION" ]; then
            echo "Unable to resolve the deployed or currently serving Cloud Run revision."
            exit 1
          fi
          DEPLOY_IMAGE="$(gcloud run revisions describe "$DEPLOY_REVISION" \
            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --format='value(spec.containers[0].image)')"
          if [ -z "$DEPLOY_IMAGE" ]; then
            echo "Unable to resolve the image for deployed revision $DEPLOY_REVISION."
            exit 1
          fi
          OIDC_AUDIENCES="$SOCIAL_DRAFT_WORKER_OIDC_AUDIENCES"
          if [ -z "$OIDC_AUDIENCES" ]; then
            OIDC_AUDIENCES="$SERVICE_URL/api/social/drafts/weekly/worker-task,$SERVICE_URL/api/social/drafts/rng-weekly/worker-task"
          fi
          ENV_UPDATES="SOCIAL_DRAFT_WORKER_OIDC_SERVICE_ACCOUNT_EMAILS=$SOCIAL_DRAFT_WORKER_OIDC_SERVICE_ACCOUNT_EMAILS##SOCIAL_DRAFT_WORKER_OIDC_AUDIENCES=$OIDC_AUDIENCES"
          append_env_update() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              ENV_UPDATES="$ENV_UPDATES##$name=$value"
            fi
          }
          append_env_update "LEAD_RUNS_TASK_QUEUE" "$LEAD_RUNS_TASK_QUEUE"
          append_env_update "LEAD_RUNS_TASK_LOCATION" "$LEAD_RUNS_TASK_LOCATION"
          append_env_update "LEAD_RUNS_TASK_SERVICE_ACCOUNT" "$LEAD_RUNS_TASK_SERVICE_ACCOUNT"
          append_env_update "LEAD_SOURCE_BUDGET_MAX_COST_USD" "$LEAD_SOURCE_BUDGET_MAX_COST_USD"
          append_env_update "LEAD_SOURCE_BUDGET_MAX_PAGES" "$LEAD_SOURCE_BUDGET_MAX_PAGES"
          append_env_update "LEAD_SOURCE_BUDGET_MAX_RUNTIME_SEC" "$LEAD_SOURCE_BUDGET_MAX_RUNTIME_SEC"
          append_env_update "SOCIAL_DRAFT_APPROVAL_BASE_URL" "$SOCIAL_DRAFT_APPROVAL_BASE_URL"
          append_env_update "SMAUTO_MCP_SERVER_URL" "$SMAUTO_MCP_SERVER_URL"
          append_env_update "SMAUTO_MCP_AUTH_MODE" "$SMAUTO_MCP_AUTH_MODE"
          append_env_update "SMAUTO_MCP_ID_TOKEN_AUDIENCE" "$SMAUTO_MCP_ID_TOKEN_AUDIENCE"
          append_env_update "SMAUTO_MCP_SOCIAL_DISPATCH_TOOL" "$SMAUTO_MCP_SOCIAL_DISPATCH_TOOL"
          append_env_update "SMAUTO_MCP_WEBHOOK_FALLBACK_ENABLED" "$SMAUTO_MCP_WEBHOOK_FALLBACK_ENABLED"
          append_env_update "SMAUTO_MCP_PROTOCOL_VERSION" "$SMAUTO_MCP_PROTOCOL_VERSION"
          append_env_update "LEADOPS_MCP_SERVER_URL" "$LEADOPS_MCP_SERVER_URL"
          append_env_update "LEADOPS_MCP_API_KEY" "$LEADOPS_MCP_API_KEY"
          # Set this even when empty so deleting the secret revokes a previously deployed allowlist.
          ENV_UPDATES="$ENV_UPDATES##AGENT_ACTION_ALLOWED_UIDS=$AGENT_ACTION_ALLOWED_UIDS"
          RUNTIME_SUFFIX="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUNTIME_REVISION="${FIREBASE_SSR_SERVICE}-${RUNTIME_SUFFIX}"
          gcloud run services update "$FIREBASE_SSR_SERVICE" \
            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --image "$DEPLOY_IMAGE" \
            --memory 512Mi \
            --no-traffic \
            --revision-suffix "$RUNTIME_SUFFIX" \
            --update-env-vars "^##^$ENV_UPDATES" \
            --quiet
          RUNTIME_REVISION_STATE="$(gcloud run revisions describe "$RUNTIME_REVISION" \
            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --format=json)"
          RUNTIME_IMAGE="$(jq -r '.spec.containers[0].image // empty' <<< "$RUNTIME_REVISION_STATE")"
          RUNTIME_READY="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // empty' <<< "$RUNTIME_REVISION_STATE")"
          if [ "$RUNTIME_IMAGE" != "$DEPLOY_IMAGE" ] || [ "$RUNTIME_READY" != "True" ]; then
            echo "Runtime revision image or readiness does not match the Firebase deployment."
            exit 1
          fi
          if ! jq -e '.spec.containers[0].env | map(.name) | index("AGENT_ACTION_ALLOWED_UIDS") != null' \
            <<< "$RUNTIME_REVISION_STATE" >/dev/null; then
            echo "Runtime revision is missing the Agent Nexus allowlist setting."
            exit 1
          fi
          RELEASE_TAG="$RUNTIME_SUFFIX"
          gcloud run services update-traffic "$FIREBASE_SSR_SERVICE" \
            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --update-tags="$RELEASE_TAG=$RUNTIME_REVISION" \
            --quiet
