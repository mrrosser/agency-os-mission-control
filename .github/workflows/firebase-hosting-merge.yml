            echo "Release candidate is not isolated at zero percent while the prior revision owns 100 percent."
            exit 1
          fi
          echo "PREVIOUS_LIVE_REVISION=$PREVIOUS_LIVE_REVISION" >> "$GITHUB_ENV"
          echo "FIREBASE_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "FIREBASE_RUNTIME_REVISION=$RUNTIME_REVISION" >> "$GITHUB_ENV"
          echo "FIREBASE_RUNTIME_IMAGE=$RUNTIME_IMAGE" >> "$GITHUB_ENV"
          echo "SMOKE_BASE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"
      - name: Post-deploy production smoke
        if: ${{ env.GCP_AUTH_READY == '1' }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'leadflow-review' }}
          SMOKE_BASE_URL: ${{ env.SMOKE_BASE_URL }}
          SMOKE_TEST_UID: ci-smoke-user-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:postdeploy
      - name: Promote verified SSR revision and preview channel to live
        if: ${{ success() && env.GCP_AUTH_READY == '1' && env.DEPLOY_PERFORMED == '1' }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'leadflow-review' }}
          FIREBASE_REGION: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE || 'leadflow-review' }}
          FIREBASE_SSR_SERVICE: ${{ vars.FIREBASE_SSR_SERVICE || 'ssrleadflowreview' }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          NPM_CONFIG_PRODUCTION: "true"
          NODE_ENV: "production"
        run: |
          set -euo pipefail
          PROMOTION_COMPLETE=0
          TRAFFIC_SWITCHED=0
          HOSTING_CLONE_STARTED=0
          ACCESS_TOKEN=""
          PREVIOUS_LIVE_HOSTING_RELEASE=""
          PREVIOUS_LIVE_HOSTING_VERSION=""
          REFRESHED_HOSTING_RELEASE=""
          REFRESHED_HOSTING_VERSION=""
          get_hosting_channel() {
            local channel_id="$1"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --header "x-goog-user-project: $FIREBASE_PROJECT_ID" \
              "https://firebasehosting.googleapis.com/v1beta1/sites/${FIREBASE_HOSTING_SITE}/channels/${channel_id}"
