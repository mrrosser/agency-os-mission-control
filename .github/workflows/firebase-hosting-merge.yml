            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --format=json)"
          CANDIDATE_URL="$(jq -r --arg tag "$RELEASE_TAG" --arg revision "$RUNTIME_REVISION" '.status.traffic[]? | select(.tag == $tag and .revisionName == $revision) | .url' \
            <<< "$TAGGED_SERVICE_STATE" | head -n1)"
          CANDIDATE_TRAFFIC="$(jq -r --arg revision "$RUNTIME_REVISION" '[.status.traffic[]? | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<< "$TAGGED_SERVICE_STATE")"
          PREVIOUS_LIVE_TRAFFIC="$(jq -r --arg revision "$PREVIOUS_LIVE_REVISION" '[.status.traffic[]? | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<< "$TAGGED_SERVICE_STATE")"
