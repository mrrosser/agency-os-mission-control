               [ -n "$ACCESS_TOKEN" ] && \
               [ -n "$PREVIOUS_LIVE_HOSTING_VERSION" ] && \
               [ -n "$REFRESHED_HOSTING_VERSION" ]; then
              ROLLBACK_LIVE_CHANNEL="$(get_hosting_channel live 2>/dev/null || true)"
              ROLLBACK_LIVE_HOSTING_VERSION="$(jq -r '.release.version.name // empty' \
                <<< "$ROLLBACK_LIVE_CHANNEL" 2>/dev/null || true)"
              if [ "$ROLLBACK_LIVE_HOSTING_VERSION" = "$REFRESHED_HOSTING_VERSION" ]; then
                echo "Promotion failed after the Hosting clone started; restoring the prior live Hosting version."
                ENCODED_ROLLBACK_VERSION="$(jq -rn --arg value "$PREVIOUS_LIVE_HOSTING_VERSION" '$value | @uri')"
