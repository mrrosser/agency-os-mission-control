          PREVIOUS_LIVE_TRAFFIC="$(jq -r --arg revision "$PREVIOUS_LIVE_REVISION" '[.status.traffic[]? | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<< "$PRE_SWITCH_STATE")"
          if [ "$TAGGED_CANDIDATE_REVISION" != "$FIREBASE_RUNTIME_REVISION" ] || \
