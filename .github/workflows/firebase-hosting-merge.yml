              echo "Live traffic changed after this workflow switched it; refusing to overwrite the newer routing state."
              return
            fi
            echo "Promotion failed; restoring Cloud Run traffic to $PREVIOUS_LIVE_REVISION."
            gcloud run services update-traffic "$FIREBASE_SSR_SERVICE" \
              --project "$FIREBASE_PROJECT_ID" \
              --region "$FIREBASE_REGION" \
              --to-revisions="$PREVIOUS_LIVE_REVISION=100" \
              --update-tags="sm-candidate=$PREVIOUS_LIVE_REVISION" \
              --quiet || true
          }
          trap rollback_runtime EXIT
          CANDIDATE_STATE="$(gcloud run revisions describe "$FIREBASE_RUNTIME_REVISION" \
            --project "$FIREBASE_PROJECT_ID" \
            --region "$FIREBASE_REGION" \
            --format=json)"
          CANDIDATE_IMAGE="$(jq -r '.spec.containers[0].image // empty' <<< "$CANDIDATE_STATE")"
          CANDIDATE_READY="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // empty' <<< "$CANDIDATE_STATE")"
          if [ "$CANDIDATE_IMAGE" != "$FIREBASE_RUNTIME_IMAGE" ] || [ "$CANDIDATE_READY" != "True" ]; then
