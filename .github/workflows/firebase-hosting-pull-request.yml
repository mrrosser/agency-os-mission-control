# Keep the protected check name while shared-service PR deployments are disabled.
# An isolated Hosting-to-runtime binding must be proven before previews return.
name: Validate Firebase PR build (preview disabled)
on: pull_request
permissions:
  contents: read
concurrency:
  group: firebase-shared-ssr-leadflow-review
  queue: max
  cancel-in-progress: false
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      WARM_RECONNECT_PROVIDER_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - run: npm ci
      - run: echo "${{ secrets.ENV_LOCAL }}" > .env.local
      - name: Force provider sends off for PR validation
        run: node scripts/firebase-preserved-runtime.mjs set-send-flag .env.local "$WARM_RECONNECT_PROVIDER_SEND_ENABLED"
      - run: npm test
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Report shared-service preview hold
        if: ${{ always() }}
        run: |
          printf '%s\n' \
            '## PR preview deployment disabled' \
            '' \
            'This required check runs tests and builds only. No preview URL is published.' \
            'Shared-service previews are held until independent Hosting-to-runtime binding is proven without changing production traffic.' \
            'No cloud authentication, Hosting deployment, runtime update, or provider send is performed by this workflow.' \
            >> "$GITHUB_STEP_SUMMARY"
